[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "louver"
version = "0.1.0"
description = "Linux fan and RGB control for the Lian Li UNI HUB AL V2 and Strimer Plus"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
louver = "louver.__main__:main"

[tool.setuptools.packages.find]
include = ["louver*"]

[tool.setuptools.package-data]
louver = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
# B905: zip() here pairs config with live state on purpose, which can be
# shorter (a hub with no reading yet); strict= would turn that into a crash.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702"]  # short setup on one line: a.clear(); b.clear()
