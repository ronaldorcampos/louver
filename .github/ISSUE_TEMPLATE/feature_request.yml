name: Feature request
description: Something Louver doesn't do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem, not the solution. What are you trying to do that Louver doesn't let you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
