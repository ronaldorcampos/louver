# Version-update PRs are capped at 5 in total: the limit is per entry, so the
# two entries below split it 4 + 1. Security-update PRs have their own fixed
# limit (10) that this file can't change.
#
# No pip entry: pyproject.toml has no runtime dependencies, only the
# setuptools>=64 build floor.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      actions:
        patterns: ["*"]

  # The ruff rev in .pre-commit-config.yaml; CI runs the same hooks.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
