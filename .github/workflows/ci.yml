name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject allows, and the newest.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # tests/test_web.py runs the UI model tests under Node, and skips
      # them when node is missing; pin it so they always run here.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install pytest
      # gui.py needs GTK/WebKit, which no test imports: at least make sure
      # every module compiles.
      - run: python -m compileall -q louver
      - run: python -m pytest -rs

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: packaging/build-deb.sh dist
      - run: packaging/deb-smoke.sh dist/louver_*_all.deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  # Push a tag like v0.2.0 (matching pyproject's version) to publish the .deb.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: The tag matches pyproject's version, and there is one .deb
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(ls dist | wc -l)" = 1
      - name: Publish (a1/b1/rc1 tags as pre-releases)
        run: |
          # A moved tag (re-tagging a fix) replaces the .deb on its existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          pre=; if printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '(a|b|rc)[0-9]+$'; then pre=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" \
            --title "Louver ${GITHUB_REF_NAME#v}" --generate-notes $pre
        env:
          GH_TOKEN: ${{ github.token }}
