name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject allows, and the newest.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # tests/test_web.py runs the UI model tests under Node, and skips
      # them when node is missing; pin it so they always run here.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install pytest
      # gui.py needs GTK/WebKit, which no test imports: at least make sure
      # every module compiles.
      - run: python -m compileall -q louver
      - run: python -m pytest -rs
